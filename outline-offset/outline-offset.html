<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 24px; font: 13px sans-serif; background: #fff; }
  .row { display: flex; gap: 40px; margin-bottom: 28px; }
  figure { margin: 0; width: 120px; text-align: center; }
  .box {
    width: 100px; height: 60px; margin: 20px 10px 10px;
    background: #cfe3f7; border: 4px solid #2d6db5;
    outline: 4px solid #e0553d;
  }
  .round { border-radius: 16px; }
  code { font-size: 12px; }
</style>
</head>
<body>
  <div class="row">
    <figure><div class="box"></div><code>offset: 0</code></figure>
    <figure><div class="box" style="outline-offset: 8px"></div><code>offset: 8px</code></figure>
    <figure><div class="box" style="outline-offset: -10px"></div><code>offset: -10px</code></figure>
    <figure><div class="box" style="outline-offset: -60px"></div><code>offset: -60px</code></figure>
  </div>
  <div class="row">
    <figure><div class="box round"></div><code>offset: 0</code></figure>
    <figure><div class="box round" style="outline-offset: 8px"></div><code>offset: 8px</code></figure>
    <figure><div class="box round" style="outline-offset: -10px"></div><code>offset: -10px</code></figure>
    <figure><div class="box round" style="outline-offset: -18px"></div><code>offset: -18px</code></figure>
  </div>
</body>
</html>
